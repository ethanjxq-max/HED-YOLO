# E + ASFF + 关闭端到端头（一对多 + NMS）
# 第三创新点候选②：ASFF 跨尺度融合在新头下的叠加效果
# E 基座 + ASFF：在三个检测头输入前各接一个自适应跨尺度融合（P3/P4/P5 → 该尺度）
# 颈部与 DB/FEM 逐字不动，只把 Detect 的输入从 [17,20,24] 换成三个 ASFF 输出
nc: 6
end2end: False # 关闭 NMS-free 一对一推理头（第6轮诊断结论）
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_DB, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2_DB, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_DB, [1024, True]]
  - [-1, 1, FEM, [1024, 4]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] #11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] #17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] #20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2_DB, [1024, True, 0.5, True]]
  - [-1, 1, FEM, [1024, 4]] #24 (P5/32-large)

  - [[17, 20, 24], 1, ASFF, [256, 0]] #25  P3 级融合
  - [[17, 20, 24], 1, ASFF, [512, 1]] #26  P4 级融合
  - [[17, 20, 24], 1, ASFF, [1024, 2]] #27  P5 级融合

  - [[25, 26, 27], 1, Detect, [nc]]
