# YOLO26s + DB + FEM + MGF(P4,P5) + SBE-P4 —— 改进点③"最终候选"合体版
# ==================================================================
# ⚠️ 使用前提：MGF-P4、MGF-P5、SBE-P4 三个单变量实验**各自**都过了判定门才跑本 yaml；
#    否则会出现"多个变量一起改、涨跌无法归因"的问题（本项目 26 组实验的铁律）。
# 内容 = E 基座 + 三处改动（每处都已单变量验证）：
#   ① MGF-P4：19/20 层 Concat [[-1, 13, 14]]（加工前 768ch + 加工后 256ch 并列）
#   ② MGF-P5：22/23 层 Concat [[-1, 11, 10]]（C2PSA 精度 + SPPF 粒度并列）
#   ③ SBE-P4：backbone 第 6 层后插入 FEM@256（40×40 尺度增强，已验证组件放新位置）
# 层号已按 SBE 插入后的编号重排（backbone 0~12，head 13~26，Detect @ 26）。
# 论文定位：消融表 A6 行（最终模型）——但主结果建议直接用"3-seed 均值±std"那一行。
# ==================================================================

# Parameters
nc: 6 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2（保持官方）
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DB, [512, False, 0.25]] # 4（DB, 256ch@80×80）
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DB, [512, True]] # 6（DB, 256ch@40×40）
  - [-1, 1, FEM, [512, 4]] # 7 ⭐SBE-P4（尺度均衡增强）
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2_DB, [1024, True]] # 9（DB）
  - [-1, 1, FEM, [1024, 4]] # 10（FEM①，P5）
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14 cat backbone P4（FEM 增强后的 40×40，768ch）
  - [-1, 2, C3k2, [512, True]] # 15（256ch，深加工粒度）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14, 15], 1, Concat, [1]] # 20 ⭐MGF-P4
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12, 11], 1, Concat, [1]] # 23 ⭐MGF-P5
  - [-1, 1, C3k2_DB, [1024, True, 0.5, True]] # 24
  - [-1, 1, FEM, [1024, 4]] # 25 (P5/32-large)

  - [[18, 21, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
