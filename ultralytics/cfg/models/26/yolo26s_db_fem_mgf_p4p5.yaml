# YOLO26s + DB + FEM + MGF（改进点③ 完整版：P4 与 P5 两级"多粒度并列融合"）
# ==================================================================
# 在 yolo26s_db_fem_mgf_p4.yaml（MGF-P4）基础上，再对 P5 头做同一条原理的第二处应用：
#   机制（本次唯一改动，一行）：
#     P5 头 Concat 由 [[-1, 11]] 扩为 [[-1, 11, 10]]：
#       -1 = 21 层（P4 头 256ch 下采样到 20×20）
#       11 = C2PSA 深加工粒度（全局注意力精炼后，512ch）
#       10 = SPPF 未深加工粒度（多尺度池化，未被任何检测头直接使用，512ch）
#     → 与 MGF-P4 严格同构：检测头同时接收"加工前(10) + 加工后(11)"两种粒度。
#   为什么这样改（证据）：
#     · 实验E 证明 P5 头"吃 C2PSA 不吃 SPPF"是 +1.1 mAP50-95 的修复 —— 说明
#       C2PSA 粒度对 P5 有价值；但**从未测过两者并列**（E、以及官方设计都是二选一）；
#     · 实验E vs E2 证明 P4 头"去掉未深加工粒度"要掉 2.6 mAP50 —— 说明"加工前"
#       粒度同样携带不可替代的信息（低对比/弱纹理缺陷的原始响应）。
#     两处证据合并成同一条可检验假设：**检测头的融合应"多粒度并列"而非"二选一"**；
#     MGF-P4 与 MGF-P5 即该假设在两个尺度上的实例化。
#   代价：零新增层、零新增参数模块；仅 22 层 Concat 输入 768→1280ch，
#         其后 C3k2_DB(23层) 的 1×1 输入投影参数 +约 131K（<1%）。
#   消融表（论文直接可用）：
#     A3  E(DB+FEM)        0.743/0.388
#     A4  +MGF-P4          见运行记录   （P4：13 与 14 并列）
#     A5  +MGF-P4+P5       见运行记录   （P4 + P5：11 与 10 并列，本 yaml）
#     旁证行 E2(只给14)      0.717/0.382  ← 反向证明"二选一"会掉点
# ==================================================================

# Parameters
nc: 6 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone（与 E 基座逐行一致，未改动）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2（保持官方）
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DB, [512, False, 0.25]] # 4（DB）
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DB, [512, True]] # 6（DB）
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_DB, [1024, True]] # 8（DB）
  - [-1, 1, FEM, [1024, 4]] # 9（FEM①，P5）
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10（未深加工多尺度池化粒度）
  - [-1, 2, C2PSA, [1024]] # 11（深加工注意力粒度）

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13 cat backbone P4（768ch = 未深加工粒度）
  - [-1, 2, C3k2, [512, True]] # 14（256ch = 深加工粒度）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13, 14], 1, Concat, [1]] # 19 ⭐MGF-P4：13 与 14 并列
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11, 10], 1, Concat, [1]] # 22 ⭐MGF-P5：11(C2PSA) 与 10(SPPF) 并列
  - [-1, 1, C3k2_DB, [1024, True, 0.5, True]] # 23
  - [-1, 1, FEM, [1024, 4]] # 24 (P5/32-large)

  - [[17, 20, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
