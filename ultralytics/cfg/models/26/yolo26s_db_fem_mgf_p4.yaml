# YOLO26s + DB + FEM + MGF-P4（改进点③ 第一步：P4 头"多粒度并列融合"）
# ==================================================================
# 设计依据（2026-09-11，基于 26 组实验的成败规律归因）：
#   证据（本项目唯一两次"零/负成本结构改动"的胜利都发生在"检测头融合输入"这一层）：
#     ① 实验E（编号14）vs exp9：把 P5 头的融合输入从 SPPF 改回 C2PSA →
#        mAP50-95 +1.1（论文基座 E = 0.743/0.388）；
#     ② 实验E（[-1,13] 宽融合）vs 实验E2（编号13，[-1,14] 官方语义）：P4 头的
#        融合输入去掉"未深加工的 40×40 融合特征(13, 768ch)"后 →
#        **mAP50 −2.6 / mAP50-95 −0.6**（0.743/0.388 → 0.717/0.382）。
#        → 即 P4 头同时需要"未深加工粒度(13)"；但 E2 只证明了"不能只有加工后粒度"，
#          **从未测过"两种粒度同时给"**——本实验补这个空缺。
#   规律：26 组失败全部集中在"在高分辨率层新增参数模块"（P3 侧 WDM/WSDM/LDTE/SGDE、
#         头侧 CAA/P2AT/PAM、采样侧 AConv/EA-Up、第四分支 P2）——1439 张训练图下
#         加参数 = 过拟合；而"融合输入的粒度/来源选择"是唯一被验证有效且零参数的杠杆。
#   机制（本 yaml 唯一改动，一行）：
#     P4 头 Concat 由 [[-1, 13]] 扩为 [[-1, 13, 14]]：
#       -1 = 18 层（P3 头 128ch 下采样到 40×40）
#       13 = 40×40 未深加工融合特征（Upsample(C2PSA) + backbone P4 的拼接，768ch）
#       14 = 13 经 C3k2 深加工后的粒度（256ch，原先只供 P3 支路）
#     → 检测头同时看到"原始融合粒度 + 深加工粒度"，信息不再二选一（防稀释）。
#   代价：零新增层、零新增参数模块；仅 19 层 Concat 输入 896→1152ch，
#         其后 C3k2(20层) 的 1×1 输入投影参数 +约 65K（<0.5%）。
#   文献支撑：R-AFPN（Scientific Reports 2025，"每层融合加回本层原始输入防特征稀释"）、
#             Gold-YOLO（NeurIPS 2023，跨层特征收集-分发）、AMFF（IEEE TIM 2024，
#             跨层互调制融合）、BiFPN/多输入加权融合（ECCV 2020）。
#   消融三角（论文表直接用）：E(只给13) 0.743/0.388 ｜ E2(只给14) 0.717/0.382
#             ｜ MGF(13+14) ← 本实验
# ==================================================================

# Parameters
nc: 6 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone（与 E 基座 yolo26s_db_fem_11_13.yaml 逐行一致，未改动）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2（保持官方）
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DB, [512, False, 0.25]] # 4（DB）
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DB, [512, True]] # 6（DB）
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_DB, [1024, True]] # 8（DB）
  - [-1, 1, FEM, [1024, 4]] # 9（FEM①，P5）
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13 cat backbone P4（768ch @40×40 = 未深加工粒度）
  - [-1, 2, C3k2, [512, True]] # 14（256ch @40×40 = 深加工粒度）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13, 14], 1, Concat, [1]] # 19 ⭐本次唯一改动：MGF-P4（896→1152ch）
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 cat head P5（C2PSA 语义供给，实验E修复）
  - [-1, 1, C3k2_DB, [1024, True, 0.5, True]] # 23
  - [-1, 1, FEM, [1024, 4]] # 24 (P5/32-large)

  - [[17, 20, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
