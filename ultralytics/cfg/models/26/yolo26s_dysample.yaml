# YOLO26s + DySample 内容感知上采样（替换颈部两处 nn.Upsample）
# ==================================================================
# 改进点③候选：替换上下采样（DySample 上采样）
#   短板依据（5 配置 × seed42 实测）：crazing 召回仅 0.406、mAP50-95 0.188（全类最差）；
#     scratches 94.3% 长宽比>3；mAP50 0.731 但 mAP50-95 0.374 ⇒ 细纹保真 + 边界对齐是缺口。
#   机制：用"内容感知的点采样"替代颈部固定插值：offset = Conv1×1(x)（**权重零初始化**）→
#     采样网格 = 规则网格 + offset → grid_sample 双线性重采样。起步严格等于双线性上采样
#     （本地实测误差 1.2e-05 = 浮点噪声），使上采样点可按内容微调、改善细长结构的边界对齐。
#   文献（素材库可核验）：《论文阅读清单_钢材缺陷检测与目标检测改进.md》第 96 行（ICCV 2023，官方代码 tiny-smart/dysample）：
#     "内容感知上采样——FPN 融合前对齐，小模块好嵌入"。
#   与已失败族的区别：已失败的 EA-Up 是"nearest + 边缘门控的**细节注入**"（往特征里加东西、带门控）；
#   本模块**不加任何信息**，只改采样位置，参数仅 8.2K/16.4K。
#   改动：head 的两处 nn.Upsample → DySample（通道保持），其余不变。
# ==================================================================
nc: 6
end2end: true
reg_max: 1
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, "Conv", [64, 3, 2]]
  - [-1, 1, "Conv", [128, 3, 2]]
  - [-1, 2, "C3k2", [256, False, 0.25]]
  - [-1, 1, "Conv", [256, 3, 2]]
  - [-1, 2, "C3k2", [512, False, 0.25]]
  - [-1, 1, "Conv", [512, 3, 2]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, "Conv", [1024, 3, 2]]
  - [-1, 2, "C3k2", [1024, True]]
  - [-1, 1, "SPPF", [1024, 5, 3, True]]
  - [-1, 2, "C2PSA", [1024]]

head:
  - [-1, 1, DySample, []]
  - [[-1, 6], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, DySample, []]
  - [[-1, 4], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [256, True]]
  - [-1, 1, "Conv", [256, 3, 2]]
  - [[-1, 13], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, "Conv", [512, 3, 2]]
  - [[-1, 10], 1, "Concat", [1]]
  - [-1, 1, "C3k2", [1024, True, 0.5, True]]
  - [[16, 19, 22], 1, "Detect", ["nc"]]
