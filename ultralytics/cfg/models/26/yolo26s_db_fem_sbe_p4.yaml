# YOLO26s + DB + FEM + SBE-P4（备选改进点③：尺度均衡增强金字塔·第一步，把已验证的
#                             FEM 从 P5 扩展到 P4 尺度）
# ==================================================================
# 设计依据（备选路线：若 MGF 系列的"零参数融合"路线无效，则走"已验证组件放新位置"路线）：
#   1) 铁律（本项目 26 组实测）：成功的都是"已验证组件放新位置 / 融合拓扑改动"，
#      失败的都是"新发明机制"或"高分辨率层加参数的重模块"；
#   2) 类级证据（E 基座 vs 原版 baseline，mAP50-95）：
#        crazing  0.202 vs 0.206（−0.004）    inclusion 0.417 vs 0.430（−0.013）
#        patches  0.577 vs 0.590（−0.013）    pitted    0.471 vs 0.453（+0.018）
#        rolled   0.228 vs 0.209（+0.019）    scratches 0.435 vs 0.340（+0.095）
#      → E 的增强只覆盖 P5(20×20)，收益集中在 scratches/rolled；**中尺度类
#        (inclusion/patches) 反而回退** —— 它们是 P4(40×40) 域的类；
#      → E 的基线 mAP50 也在 inclusion 上回退最多（0.775 vs baseline 0.809，−3.4）；
#   3) 文献：AMFF（IEEE TIM 2024，多尺度跨层增强注意力）、AFF-Net（IEEE TIM 2024，
#      聚焦式 FPN，NEU-DET 83.5 mAP50）、Gold-YOLO（NeurIPS 2023，跨尺度收集-分发）
#      均支持"增强应覆盖各级检测尺度"；
#   4) 与失败的 P3 侧模块的本质区别：FEM 是"软增强"（残差 + Sigmoid 门控 + 通道注意力
#      融合权重，三分支：纹理/结构/全局），不是硬高频注入（WDM/WSDM）也不是方向核注入
#      （LDTE），且放在 **backbone P4 输出后**（P3/P4 backbone 位置从未试过任何模块）。
#   结构（唯一改动）：
#     backbone 第 6 层（C3k2_DB @40×40, 256ch）之后插入一行：
#       - [-1, 1, FEM, [512, 4]]     # 实际宽度 256（width=0.5），参数量 ≈0.29M
#     其后所有层号 +1（head 引用同步修正，见下方注释）。
#   代价：+0.29M 参数（+2.3%）、40×40 分辨率；无新增检测分支。
#   判定门（单变量）：mAP50-95 ≥ 0.390 且 mAP50 ≥ 0.743，且 inclusion mAP50 回升 ≥0.78。
# ==================================================================

# Parameters
nc: 6 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2（保持官方）
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DB, [512, False, 0.25]] # 4（DB, 256ch@80×80）
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DB, [512, True]] # 6（DB, 256ch@40×40）
  - [-1, 1, FEM, [512, 4]] # 7 ⭐新增：SBE-P4（尺度均衡增强，256ch@40×40）
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2_DB, [1024, True]] # 9（DB）
  - [-1, 1, FEM, [1024, 4]] # 10（FEM①，P5）
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14 cat backbone P4（= 新 7 层 FEM 输出，增强后的 P4）
  - [-1, 2, C3k2, [512, True]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17 cat backbone P3（保持不变）
  - [-1, 2, C3k2, [256, True]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, Concat, [1]] # 20 cat head P4（宽融合，实验E2证明保留）
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P5（C2PSA = 新 12 层）
  - [-1, 1, C3k2_DB, [1024, True, 0.5, True]] # 24
  - [-1, 1, FEM, [1024, 4]] # 25 (P5/32-large)

  - [[18, 21, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
