# YOLO26s + DCNorm（可学习多尺度除性对比度归一化，输入级）
# ==================================================================
# 改动：在官方 yolo26s 最前面插入 1 层 DCNorm（3 通道，仅 6 个参数），其余逐层不变。
#   机制：out = x·(1 − tanh(λ)·clamp(s_rel − 1))，s_rel 为多尺度邻域相对能量；
#   作用：把"绝对灰度"折算成"相对对比度"，让低对比纹理（crazing/rolled-in_scale）在特征上不再被压制；
#   与 CLAHE/DCAM-Net(TIM 2023) 的固定预处理不同：这是可微、可学习、与检测器联合优化的归一化层。
# 设计依据（NEU-DET 定量分析，2026-09-12）：
#   · 4189 个实例等效边长中位 220px（640 口径），81% 落在 P5 域（>128px），仅 1.2% 在 P3 域；
#     scratches 94.3% 长宽比>3（中位长边 560px）→ 本任务是"大区域 + 细长 + 低对比 + 纹理定义"。
#   · YOLO26 检测头在 stride 8/16/32，P5 的一个 3×3 卷积覆盖原图 96×96 区域，
#     细纹理早已被平均掉；而 81% 的实例恰恰由 P4/P5 判决 → **特征分辨率与判别依据错配**。
#   · YOLO26 全程只有 BN（全局、逐通道）归一化，**没有空间局部的对比度归一化**；
#     也**没有任何显式的纹理统计通路**（C2PSA 只在 P5 做位置注意力）。
# 两个组件都是"通道不变 + 零初始化 → 起点严格恒等"，因此：
#   · 训练起点与官方 yolo26s 逐位一致（不会出现"开局伤特征"）；
#   · 可用 map_pretrained.py 把官方 COCO 权重 1:1 迁进来（脚本按模块族对齐，能处理插入造成的层号偏移）。
# ==================================================================
nc: 6
end2end: true
reg_max: 1
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, "DCNorm", []]
  - [-1, 1, "Conv", [64, 3, 2]]
  - [-1, 1, "Conv", [128, 3, 2]]
  - [-1, 2, "C3k2", [256, False, 0.25]]
  - [-1, 1, "Conv", [256, 3, 2]]
  - [-1, 2, "C3k2", [512, False, 0.25]]
  - [-1, 1, "Conv", [512, 3, 2]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, "Conv", [1024, 3, 2]]
  - [-1, 2, "C3k2", [1024, True]]
  - [-1, 1, "SPPF", [1024, 5, 3, True]]
  - [-1, 2, "C2PSA", [1024]]

head:
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]
  - [[-1, 7], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]
  - [[-1, 5], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [256, True]]
  - [-1, 1, "Conv", [256, 3, 2]]
  - [[-1, 14], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, True]]
  - [-1, 1, "Conv", [512, 3, 2]]
  - [[-1, 11], 1, "Concat", [1]]
  - [-1, 1, "C3k2", [1024, True, 0.5, True]]
  - [[17, 20, 23], 1, "Detect", ["nc"]]
