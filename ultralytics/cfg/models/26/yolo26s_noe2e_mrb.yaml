# baseline + MRB + 关闭端到端头（一对多 + NMS）
# 第三创新点候选①：MRB 在 e2e 头下与基线持平（0.371 vs 0.370），在新头下重测
# MRB 单模块版：全部 C3k2 → C3k2_MRB（训练期多分支、推理期折叠为单卷积）
# 作用：第三创新点的"单模块消融行"（论文表格：baseline / +MRB）
# 与官方 yaml 的唯一差别：7 处 C3k2 换成 C3k2_MRB，其余逐字不动
nc: 6
end2end: False # 关闭 NMS-free 一对一推理头（第6轮诊断结论）
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2_MRB, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_MRB, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2_MRB, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2_MRB, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2_MRB, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2_MRB, [256, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2_MRB, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2_MRB, [1024, True, 0.5, True]]

  - [[16, 19, 22], 1, Detect, [nc]]
